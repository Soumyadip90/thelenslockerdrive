        .hamburger { display: none; flex-direction: column; justify-content: space-between; width: 28px; height: 20px; background: transparent; border: none; cursor: pointer; z-index: 1001; }
        .hamburger span { display: block; height: 3px; width: 100%; background-color: var(--text-dark); border-radius: 2px; transition: all 0.3s ease; }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        #page-header { height: 40vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://cvsqtgaxsa.cloudimg.io/https://images.prismic.io/indiahike/5cba676d-2c0f-4147-8549-1ae452aca1ba_Madhmaheshwar+-+Mahendra+-+October+-+Indiahikes+-+Contribution+%2837%29+copy.jpg?&q=50&org_if_sml=1') center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: var(--text-light); padding: 0 20px; margin-top: 70px; }
        #page-header h1 { font-size: 3.5rem; margin-bottom: 0.5rem; }
        
        section { padding: 4rem 5%; min-height: 50vh; }
        .photo-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .photo-item { border-radius: 8px; overflow: hidden; aspect-ratio: 1; cursor: zoom-in; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .photo-item:hover img { transform: scale(1.08); }
        
        .modal { display: none; position: fixed; z-index: 2000; padding-top: 60px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 80vh; border-radius: 4px; object-fit: contain; animation: zoom 0.4s; }
        @keyframes zoom { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-modal { position: absolute; top: 15px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 2001; }
        .close-modal:hover { color: var(--primary-color); }

        footer { background-color: var(--text-dark); color: var(--text-light); text-align: center; padding: 2rem; font-size: 0.9rem; }

            .nav-links.open { right: 0; }

let allFolders = [];
let allImages = [];
let currentFolderId = null; // 'null' represents the main home view

// 1. Fetch all Folders
db.collection("photofolder").orderBy("foldername").onSnapshot(snapshot => {
    allFolders = [];
    snapshot.forEach(doc => allFolders.push({ id: doc.id, ...doc.data() }));
    renderCurrentView();
});

// 2. Fetch all Images
db.collection("photogal").onSnapshot(snapshot => {
    allImages = [];
    snapshot.forEach(doc => allImages.push({ id: doc.id, ...doc.data() }));
    renderCurrentView();
});

// 3. Navigation Controller
function navigateTo(foldId) {
    // If passed an empty string, go back to root
    currentFolderId = (foldId === '' || foldId === 'null') ? null : foldId;
    renderCurrentView();
}

// 4. Render the UI based on currentFolderId
function renderCurrentView() {
    const grid = document.getElementById('portfolioGrid');
    const nav = document.getElementById('portfolioNav');
    
    grid.innerHTML = '';
    nav.innerHTML = '';

    // --- RENDER NAVIGATION HEADER ---
    if (currentFolderId === null) {
        nav.innerHTML = `<h2 style="margin: 0; font-family: 'Playfair Display', serif;">Portfolio Categories</h2>`;
    } else {
        const currentFolder = allFolders.find(f => f.id === currentFolderId);
        // If current folder has a parent, Back goes there. Otherwise, Back goes to root ('').
        const backTarget = (currentFolder && currentFolder.parentId) ? currentFolder.parentId : '';
        
        nav.innerHTML = `
            <button onclick="navigateTo('${backTarget}')" style="padding: 8px 16px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                &larr; Back
            </button>
            <h2 style="margin: 0; font-family: 'Playfair Display', serif; color: #d4a373;">
                ${currentFolder ? currentFolder.foldername : 'Category'}
            </h2>
        `;
    }

    // --- RENDER FOLDERS ---
    // Find folders that belong in the current view
    const foldersToShow = allFolders.filter(f => {
        if (currentFolderId === null) return !f.parentId; // Show main folders at root
        return f.parentId === currentFolderId; // Show subfolders when inside a parent
    });

    foldersToShow.forEach(f => {
        // A clickable Card representing a folder
        grid.innerHTML += `
            <div onclick="navigateTo('${f.id}')" style="background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.03);" onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 8px 20px rgba(0,0,0,0.08)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(0,0,0,0.03)'">
                <div style="font-size: 50px; margin-bottom: 15px; opacity: 0.8;">📁</div>
                <h3 style="margin: 0; color: #333; font-size: 1.2rem;">${f.foldername}</h3>
            </div>
        `;
    });

    // --- RENDER IMAGES ---
    // Find images that were uploaded directly to this specific folder
    const imagesToShow = allImages.filter(img => {
        if (currentFolderId === null) return !img.foldId; // Images unassigned to any folder
        return img.foldId === currentFolderId;
    });

    imagesToShow.forEach(img => {
        // A standard Image card
        grid.innerHTML += `
            <div onclick="openModal('${img.url}')" style="border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s; cursor: pointer;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                <img src="${img.url}" style="width: 100%; height: 280px; object-fit: cover; display: block;" alt="Portfolio Image">
            </div>
        `;
    });

    // --- EMPTY STATE ---
    if (foldersToShow.length === 0 && imagesToShow.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #888; padding: 3rem 0; font-size: 1.1rem;">This folder is empty.</p>';
    }
}


function openModal(imgUrl) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    
    modal.style.display = "flex"; // Show the modal
    modalImg.src = imgUrl; // Set the large image URL
    
    // Optional: Prevent background scrolling while modal is open
    document.body.style.overflow = 'hidden'; 
}

// Close the Modal
function closeModal() {
    document.getElementById('imageModal').style.display = "none";
    document.body.style.overflow = 'auto'; // Restore scrolling
}

// Close the modal if the user clicks the dark background outside the image
document.getElementById('imageModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeModal();
    }
});
