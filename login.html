<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | The Pixel Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #d4a373; --bg-color: #f4f6f8; --text-dark: #333333; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', sans-serif; background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        
        .login-container { background: var(--white); padding: 3rem 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        
        .logo { display: flex; flex-direction: column; align-items: center; text-decoration: none; margin-bottom: 2rem; gap: 10px; }
        .logo img { height: 50px; width: auto; object-fit: contain; }
        .logo-text { font-size: 1.3rem; font-family: 'Playfair Display', serif; color: var(--text-dark); letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }

        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Lato', sans-serif; font-size: 1rem; }
        
        .btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: var(--white); border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; font-weight: 700; transition: background 0.3s; }
        .btn:hover { background-color: #b88a5d; }
        .error-msg { color: #e63946; font-size: 0.85rem; margin-top: 10px; display: none; }
        .back-link { display: inline-block; margin-top: 1.5rem; font-size: 0.85rem; color: #888; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="index.html" class="logo">
            <img src="#" alt="">
            <span class="logo-text">The Pixel Room</span>
        </a>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" required placeholder="Enter password...">
            </div>
            <button type="submit" class="btn">Login to Dashboard</button>
            <div class="error-msg" id="errorMsg">Incorrect password. Please try again.</div>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Website</a>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123"; // You can change this password

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('password').value === ADMIN_PASSWORD) {
                sessionStorage.setItem('glow_isLoggedIn', 'true');
                window.location.replace('admin.html');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('password').value = '';
            }
        });

        if (sessionStorage.getItem('glow_isLoggedIn') === 'true') {
            window.location.replace('admin.html');
        }
    </script>
</body>
</html>
